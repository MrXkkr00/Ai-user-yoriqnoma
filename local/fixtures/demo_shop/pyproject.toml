[project]
name = "demo-shop"
version = "0.1.0"
description = "Test site (polygon) for AI_user_yoriqnoma: FastAPI + React shop with customer, manager, courier and admin roles."
requires-python = ">=3.12"
# demo_shop is the studied site, not our tool: it may use its own SQLite database.
# It is never imported by yoriqnoma_scanner or yoriqnoma_core.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
demo-shop = "demo_shop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_shop"]

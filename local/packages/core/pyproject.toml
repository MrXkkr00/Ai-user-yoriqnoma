[project]
name = "yoriqnoma-core"
version = "0.1.0"
description = "Explorer (Playwright), writer (LLM providers), renderer and safety layer."
requires-python = ">=3.12"
# No Django, no DB drivers or ORMs: enforced by tests/test_no_db_drivers.py.
dependencies = [
    "yoriqnoma-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoriqnoma_core"]

{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Kirish</h1>
  {% if form.errors %}<p class="error">Login yoki parol noto'g'ri.</p>{% endif %}
  <form method="post" class="form">{% csrf_token %}
    <div class="field"><label for="id_username">Foydalanuvchi nomi</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Parol</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Kirish</button>
  </form>
  <p class="small muted">Hisobingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>.</p>
</div>
{% endblock %}

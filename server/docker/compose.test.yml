# End-to-end test profile (TZ QM-4..QM-6): demo_shop as the studied site.
#   docker compose -f docker/compose.yml -f docker/compose.test.yml --profile test up -d
# The e2e settings allow exactly one private host name, "demo_shop" (the test site's
# container). Production settings always allow none (TZ SEC-10).

x-e2e-env: &e2e-env
  DJANGO_SETTINGS_MODULE: yoriqnoma_server.settings.e2e

services:
  web:
    environment: *e2e-env
    ports: ["127.0.0.1:8000:8000"]
  worker:
    environment:
      <<: *e2e-env
      YORIQNOMA_ROLE: worker
    depends_on:
      demo_shop: {condition: service_started}
  beat:
    environment: *e2e-env

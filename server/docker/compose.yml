# Server app (ARCHITECTURE §7.1). Run from server/:
#   docker compose -f docker/compose.yml up -d
# Env files live only on the server (never in git): docker/.env for every app service,
# docker/worker.env (only ANTHROPIC_API_KEY) for the worker alone (TZ SEC-12).
# Templates: docker/.env.example, docker/worker.env.example. Deploy guide: docs/DEPLOY.md.

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile.web
  image: yoriqnoma-server-web
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: [.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy-data:/data
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}

  web:
    <<: *app
    volumes:
      - static:/app/staticfiles-shared
    command: ["sh", "-c", "cp -r /app/staticfiles/. /app/staticfiles-shared/ && sh docker/web-entrypoint.sh"]
    entrypoint: []
    networks: [edge, internal]
    # «web answers»: /healthz needs no login and no database. The request carries the site's
    # own host name and the https header, so ALLOWED_HOSTS and the SSL redirect let it in.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          host = os.environ["DJANGO_ALLOWED_HOSTS"].split(",")[0].strip()
          host = "health" + host if host.startswith(".") else host
          req = u.Request("http://127.0.0.1:8000/healthz", headers={"Host": host, "X-Forwarded-Proto": "https"})
          u.urlopen(req, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: yoriqnoma-server-worker
    # the Claude key is given to this service only
    env_file: [.env, worker.env]
    environment:
      YORIQNOMA_ROLE: worker
    mem_limit: 4g
    cpus: 2.0
    shm_size: 1g
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # internal: database, queue, files, test mail; egress: the internet, behind the
    # firewall rules of docker/egress-firewall.sh (no private address ranges)
    networks: [internal, egress]

  beat:
    <<: *app
    command: ["celery", "-A", "yoriqnoma_server", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    entrypoint: []
    tmpfs: ["/tmp"]
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yoriqnoma}
      POSTGRES_USER: ${POSTGRES_USER:-yoriqnoma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-yoriqnoma}"]
      interval: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in docker/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in docker/.env}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 20
    networks: [internal, edge]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: [.env]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set store http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "store/$$S3_BUCKET" &&
        mc anonymous set none "store/$$S3_BUCKET"
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    # catch-all test inbox: *@inbox.<server domain> (MX record points to this server)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports: ["25:1025"]
    networks: [internal, edge]

  demo_shop:
    profiles: [test]
    build:
      context: ../../local/fixtures/demo_shop
      dockerfile: ../../../server/docker/Dockerfile.demo_shop
    image: yoriqnoma-demo-shop
    environment:
      MAILPIT_SMTP: mailpit:1025
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true
  egress:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  static: {}
  caddy-data: {}
  postgres-data: {}
  redis-data: {}
  minio-data: {}

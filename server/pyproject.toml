# SERVER APP. A complete, self-contained uv project: install and deploy it from this folder.
# It works on its own on an online server, visits sites on the internet and writes the
# manual with the Claude API. It never receives data from the local app automatically:
# a person uploads blueprint.json or bundle.zip through the web form.
#
# packages/ holds copies of schemas and core from ../local/packages;
# tests/test_shared_copies.py keeps the two copies identical.

[project]
name = "yoriqnoma-server"
version = "0.1.0"
description = "Server Django app: modes A, A' and B, writes the manual with the Claude API."
requires-python = ">=3.12"
dependencies = [
    "yoriqnoma-schemas",
    "yoriqnoma-core[claude]",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "celery[redis]>=5.4",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "django-storages>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoriqnoma_server", "accounts", "domains", "jobs", "scout", "security", "api"]

[tool.uv.workspace]
members = ["packages/schemas", "packages/core"]

[tool.uv.sources]
yoriqnoma-schemas = { workspace = true }
yoriqnoma-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "pre-commit>=4.0",
]

# --- ruff ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/schemas/src", "packages/core/src", "."]
extend-exclude = ["migrations", "var"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "DJ", # flake8-django
]

[tool.ruff.lint.per-file-ignores]
# JavaScript run in the browser lives in Python strings.
"packages/core/src/yoriqnoma_core/explorer/js.py" = ["E501"]

# --- mypy: strict everywhere, Django via django-stubs and DRF stubs -----------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = ["packages/schemas/src", "packages/core/src"]
files = ["."]
exclude = ['^\.venv/', '^var/', '(^|/)migrations/']
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "environ", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "yoriqnoma_server.settings.dev"

# --- pytest -------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yoriqnoma_server.settings.test"
minversion = "8.0"
testpaths = ["packages", "tests", "yoriqnoma_server", "accounts", "domains", "jobs", "scout", "security", "api"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "llm: needs the real Claude API (ANTHROPIC_API_KEY)",
    "slow: integration tests that start demo_shop or a browser",
    "server: server end-to-end tests against docker compose",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

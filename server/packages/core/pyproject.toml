[project]
name = "yoriqnoma-core"
version = "0.1.0"
description = "Explorer (Playwright), writer (LLM providers), renderer and safety layer."
requires-python = ">=3.12"
# No Django, no DB drivers or ORMs: enforced by tests/test_no_db_drivers.py.
dependencies = [
    "yoriqnoma-schemas",
    "playwright>=1.48",
    "pillow>=11.0",
    "httpx>=0.27",
    "ollama>=0.4",
    "jinja2>=3.1",
    "python-docx>=1.1",
    # Offline OCR for text inside images (TZ FR-E10), Apache 2.0, CPU only.
    "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
# The server writes with Claude; the local app does not install the SDK.
claude = ["anthropic>=1.0"]

[project.scripts]
yoriqnoma-core = "yoriqnoma_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoriqnoma_core"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKERS: not llm and not slow and not server

jobs:
  # Local app: runs on the user's computer (Windows or Linux).
  local:
    name: local (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: local/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -m "${{ env.MARKERS }}"
      # NFR-7 targets: packages >= 80%, apps >= 60%. Report only: the fast tests skip the real
      # browser runs ("slow"), which cover much of the explorer.
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: >
          uv run --with pytest-cov pytest -m "${{ env.MARKERS }}"
          --cov=packages/core/src --cov=packages/scanner/src --cov=packages/schemas/src
          --cov=projects --cov=runs --cov=settings_app --cov=evaluation --cov=yoriqnoma_local
          --cov-report=term:skip-covered -q

  # Server app: runs on a Linux server in Docker.
  server:
    name: server (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -m "${{ env.MARKERS }}"
      - name: Coverage report
        run: >
          uv run --with pytest-cov pytest -m "${{ env.MARKERS }}"
          --cov=packages/core/src --cov=packages/schemas/src
          --cov=accounts --cov=api --cov=domains --cov=jobs --cov=scout --cov=security
          --cov=yoriqnoma_server
          --cov-report=term:skip-covered -q

[project]
name = "yoriqnoma-local"
version = "0.1.0"
description = "Local Django app: scans code, explores the site and writes the manual with Ollama."
requires-python = ">=3.12"
dependencies = [
    "yoriqnoma-schemas",
    "yoriqnoma-scanner",
    "yoriqnoma-core",
    "django>=5.2,<5.3",
    "huey>=2.5",
    "waitress>=3.0",
]

[project.scripts]
yoriqnoma-local = "yoriqnoma_local.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoriqnoma_local", "projects", "runs", "settings_app", "uploader", "evaluation"]

# Run from the repo root with: uv run pytest apps/local
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yoriqnoma_local.settings_test"
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "llm: needs a real LLM (Ollama or Claude)",
    "slow: integration tests that start demo_shop or a browser",
    "server: server end-to-end tests against docker compose",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Run from the repo root with: uv run --directory apps/local mypy
[tool.mypy]
python_version = "3.12"
files = ["."]
exclude = ["(^|/)migrations/"]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["huey", "huey.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "yoriqnoma_local.settings"

# local/ and server/ are separate uv projects, so each one is checked with its own ruff
# (the version pinned in its uv.lock). Install once: uv run --directory local pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-local
        name: ruff check (local)
        entry: uv run --directory local ruff check --fix .
        language: system
        files: ^local/
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format-local
        name: ruff format (local)
        entry: uv run --directory local ruff format .
        language: system
        files: ^local/
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-server
        name: ruff check (server)
        entry: uv run --directory server ruff check --fix .
        language: system
        files: ^server/
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format-server
        name: ruff format (server)
        entry: uv run --directory server ruff format .
        language: system
        files: ^server/
        types_or: [python, pyi]
        pass_filenames: false
